# Included from inside the server block of meet.conf, via the image's
# documented hook: include /run/web/config/nginx-custom/*.conf
#
# Serves the Griffin brand assets and the theme JSON that
# DYNAMIC_BRANDING_URL points at. Kept out of /usr/share/jitsi-meet so a
# Jitsi image upgrade cannot overwrite them.
#
# The `^~` is load-bearing, and two separate traps live here.
#
# 1. Jitsi's meet.conf defines  location ~ ^/([^/?&:'"]+)/(.*)$  to route
#    /<room>/<anything>. In nginx a REGEX location beats a plain prefix
#    location no matter which is declared first, so a bare
#    `location /griffin/` loses every time and the logos come back as the
#    app's own index.html: 30KB, content type text/html, HTTP 200, no
#    error logged anywhere. `^~` tells nginx to stop and not consider
#    regex locations once this prefix matches.
#
# 2. Do NOT add `try_files $uri` alongside `alias`. With alias, $uri is
#    still the FULL request path, so nginx looks for
#    /run/web/config/griffin/ + /griffin/wordmark.png and finds nothing.
#
# Either mistake fails silently and looks exactly like a missing logo.
# Verify with:  curl -sI https://meet.thegriffinfund.org/griffin/wordmark.png
# and check that the content type is image/png, not text/html.

location ^~ /griffin/ {
    alias /run/web/config/griffin/;
    add_header Cache-Control "public, max-age=300";
    add_header X-Content-Type-Options "nosniff";
}

location = /griffin/branding.json {
    alias /run/web/config/griffin/branding.json;
    default_type application/json;
    # Short cache: a theme edit should show up on the next reload, not
    # after someone clears their browser.
    add_header Cache-Control "public, max-age=60";
}
